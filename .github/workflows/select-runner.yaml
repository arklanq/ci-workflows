name: Select runner

on:
  workflow_call:
    inputs:
      primary-runner:
        description: Comma-separated labels matching the preferred runner, with exact case and no spaces.
        type: string
        default: self-hosted,ubuntu-26.04-self-hosted
      fallback-runner:
        description: Single GitHub-hosted runner label used when the primary is unavailable.
        type: string
        default: ubuntu-26.04
    outputs:
      runner:
        description: JSON array of selected runner labels, to be parsed with fromJSON.
        value: ${{ jobs.select-runner.outputs.runner }}

jobs:
  select-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.select.outputs.use-runner }}
    steps:
      - name: Select a runner through the GitHub App service
        id: select
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0.
        env:
          PRIMARY_RUNNER: ${{ inputs.primary-runner }}
          FALLBACK_RUNNER: ${{ inputs.fallback-runner }}
          RUNNER_SERVICE_URL: https://ci-workflows.vercel.app/api/select-runner
        with:
          script: |
            const primary = process.env.PRIMARY_RUNNER.split(',');
            const fallback = [process.env.FALLBACK_RUNNER];
            core.setOutput('use-runner', JSON.stringify(fallback));

            try {
              const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
              tokenUrl.searchParams.set('audience', 'https://github.com/arklanq/ci-workflows');
              const identityResponse = await fetch(tokenUrl, {
                headers: { authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
                redirect: 'error',
                signal: AbortSignal.timeout(10_000),
              });
              if (!identityResponse.ok) throw new Error('OIDC request failed.');
              const identity = await identityResponse.json();
              if (typeof identity.value !== 'string' || !identity.value) throw new Error('Missing OIDC token.');
              core.setSecret(identity.value);

              const response = await fetch(process.env.RUNNER_SERVICE_URL, {
                method: 'POST',
                headers: {
                  authorization: `Bearer ${identity.value}`,
                  'content-type': 'application/json',
                },
                body: JSON.stringify({
                  primaryRunner: process.env.PRIMARY_RUNNER,
                  fallbackRunner: process.env.FALLBACK_RUNNER,
                }),
                redirect: 'error',
                signal: AbortSignal.timeout(10_000),
              });
              if (!response.ok) throw new Error('Runner lookup failed.');
              const { runner } = await response.json();
              const matches = labels => Array.isArray(runner) &&
                runner.length === labels.length && runner.every((label, index) => label === labels[index]);
              if (!matches(primary) && !matches(fallback)) throw new Error('Unexpected runner labels.');
              core.setOutput('use-runner', JSON.stringify(runner));
            } catch {
              core.warning('Runner selection is unavailable; using the GitHub-hosted fallback.');
            }
