name: Linux runner example

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  determine-runner:
    permissions:
      id-token: write
    uses: arklanq/ci-workflows/.github/workflows/select-runner.yaml@main
    with:
      primary-runner: self-hosted,ubuntu-26.04-self-hosted
      fallback-runner: ubuntu-26.04

  linux-job:
    needs: determine-runner
    runs-on: ${{ fromJSON(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 5
    steps:
      - name: Verify the selected environment
        run: |
          uname -srm
          whoami
          docker version --format '{{.Server.Version}}'
